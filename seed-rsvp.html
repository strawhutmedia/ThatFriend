<!DOCTYPE html>
<html><head>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<style>body{background:#0d1b21;color:#f5f0e8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;}</style>
</head><body>
<div id="msg">Removing old entries...</div>
<script>
try {
    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();
    var removes = [
        'lucia_lopez',

        'connor_simpson',
        'lisane_basquiat',
        'ashley_smith',
        'samantha_prete',
        'maddy_cross'
    ];
    var done = 0, errors = [];

    function check() {
        if (done + errors.length === removes.length) {
            if (errors.length === 0) {
                document.getElementById('msg').innerHTML =
                    '<h2 style="color:#4CAF50;">Done!</h2>' +
                    '<p>Removed ' + done + ' old entries from Firebase</p>' +
                    '<p style="margin-top:0.5rem;font-size:0.8rem;color:rgba(255,255,255,0.5);">' + removes.join(', ') + '</p>' +
                    '<p style="margin-top:1rem;"><a href="/guestlist?v=10" style="color:#FF8C42;">Check guest list</a></p>';
            } else {
                document.getElementById('msg').innerHTML = '<h2 style="color:#e57373;">Errors</h2><p>' + errors.join('<br>') + '</p>';
            }
        }
    }

    removes.forEach(function(key) {
        db.ref('rsvps/' + key).remove()
            .then(function() { done++; check(); })
            .catch(function(e) { errors.push(key + ': ' + e.message); check(); });
    });

} catch(e) {
    document.getElementById('msg').innerHTML = '<h2 style="color:#e57373;">Error</h2><p>' + e.message + '</p>';
}
</script>
</body></html>
