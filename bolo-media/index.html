<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolo Media</title>
    <meta name="description" content="Bolo Media is a film and media production company. Producer of That Friend, an official selection of the 2026 Tribeca Festival.">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-wordmark">Bolo</a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="press.html">Press</a></li>
                <li><a href="team.html">Team</a></li>
                <!-- TODO: replace # with Bolo's IMDb company page and Instagram profile -->
                <li class="nav-ext"><a href="#" target="_blank" rel="noopener">IMDb</a></li>
                <li class="nav-ext"><a href="#" target="_blank" rel="noopener">Instagram</a></li>
            </ul>
            <div class="hamburger" id="hamburger" aria-label="Menu" role="button" tabindex="0">
                <span></span><span></span><span></span>
            </div>
        </div>
    </nav>

    <main>
        <section class="hero">
            <!-- When the logo file is ready, replace the two lines below with:
                 <img src="assets/bolo-logo.png" alt="Bolo Media" class="hero-logo"> -->
            <h1 class="hero-wordmark">BOLO</h1>
            <p class="hero-sub">Media</p>

            <p class="hero-tagline">A film &amp; media production company</p>

            <p class="hero-credit">
                <a href="https://thatfriendmovie.com" target="_blank" rel="noopener">That Friend</a>
                &nbsp;&mdash;&nbsp; Official Selection, 2026 Tribeca Festival
            </p>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="press.html">Press</a>
            <a href="team.html">Team</a>
        </div>
        <p class="footer-copy">&copy; 2026 Bolo Productions, LLC. All rights reserved.</p>
    </footer>

    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        hamburger.addEventListener('click', () => navLinks.classList.toggle('open'));
        hamburger.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navLinks.classList.toggle('open'); }
        });
    </script>
</body>
</html>
