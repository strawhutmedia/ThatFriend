    <title>Guest List - That Friend Premiere</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0d1b21;
            font-family: 'Montserrat', sans-serif;
            color: #f5f0e8;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .page-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .page-header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.4rem;
            letter-spacing: 6px;
            color: #f5f0e8;
            margin-bottom: 0.3rem;
        }
        .page-header p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 2px;
        }
        .stats {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .stat-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            padding: 1rem 1.5rem;
            text-align: center;
            min-width: 120px;
        }
        .stat-number {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            color: #FF8C42;
            line-height: 1;
        }
        .stat-label {
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-top: 0.3rem;
        }
        .section-label {
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #FF8C42;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .guest-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2.5rem;
        }
        .guest-table th {
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            text-align: left;
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            white-space: nowrap;
        }
        .guest-table td {
            padding: 0.7rem 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85rem;
            vertical-align: middle;
        }
        .guest-table tr:hover td {
            background: rgba(255,255,255,0.03);
        }
        .guest-name {
            font-weight: 600;
        }
        .guest-role {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            font-weight: 300;
        }
        .badge {
            display: inline-block;
            font-size: 0.55rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 0.2rem 0.5rem;
            border-radius: 2px;
            font-weight: 600;
        }
        .badge-vip {
            background: rgba(255,140,66,0.15);
            color: #FF8C42;
            border: 1px solid rgba(255,140,66,0.3);
        }
        .badge-regular {
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .status {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.15rem 0.5rem;
            border-radius: 2px;
        }
        .status-pending {
            color: rgba(255,255,255,0.3);
        }
        .status-yes {
            color: #4CAF50;
        }
        .status-no {
            color: #e57373;
        }
        .invite-link {
            font-size: 0.7rem;
            color: #FF8C42;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid rgba(255,140,66,0.3);
            padding: 0.2rem 0.5rem;
            border-radius: 2px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .invite-link:hover {
            background: rgba(255,140,66,0.15);
        }
        .invite-link.copied {
            border-color: #4CAF50;
            color: #4CAF50;
        }
        .tickets-col {
            text-align: center;
        }
        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.25);
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        @media (max-width: 700px) {
            .guest-table { font-size: 0.78rem; }
            .guest-table th, .guest-table td { padding: 0.5rem 0.4rem; }
            .guest-role { display: block; margin-top: 0.15rem; }
            .hide-mobile { display: none; }
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="assets/firebase-config.js"></script>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W7RCZNFN"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="container">
        <div class="page-header">
            <h1>That Friend</h1>
            <p>Premiere Guest List &mdash; June 8, 2026</p>
        </div>

        <div class="stats" id="stats"></div>

        <div class="section-label">VIP &mdash; Red Carpet</div>
        <table class="guest-table" id="vipTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th class="hide-mobile">Role</th>
                    <th class="tickets-col">Tickets</th>
                    <th>Premiere</th>
                    <th>Invite</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="section-label">General Admission</div>
        <table class="guest-table" id="regularTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th class="tickets-col">Tickets</th>
                    <th>Premiere</th>
                    <th>Invite</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="footer-note">
            <span id="dbStatus" style="color:#FF8C42;">Connecting to database...</span><br>
            Village East Cinemas-01 &bull; New York City &bull; Tribeca Festival 2026
        </div>
    </div>

    <script>
        var baseUrl = 'https://thatfriendmovie.com/premiere';

        var guests = [
            { name: 'Nikole Schroder', role: 'Press / SSML', tickets: 5, vip: true },
            { name: 'Max Geschwind', role: 'Sales / CAA', tickets: 5, vip: true },
            { name: 'Billie Lourd', role: 'Film team', tickets: 10, vip: true },
            { name: 'Josh Brener', role: 'Film team', tickets: 2, vip: true },
            { name: 'Harvey Guillen', role: 'Film team', tickets: 14, vip: true },
            { name: 'Alok', role: 'Film team', tickets: 2, vip: true },
            { name: 'Miles Gutierrez-Riley', role: 'Film team', tickets: 2, vip: true },
            { name: 'Retta', role: 'Film team', tickets: 3, vip: true },
            { name: 'Ryan Tillotson', role: 'Producer', tickets: 1, vip: true },
            { name: 'Maggie Boles', role: 'Original Music', tickets: 1, vip: true },
            { name: 'Ashley Rosenberg', role: 'AD', tickets: 1, vip: true },
            { name: 'Dillon Baldassero', role: 'Composer', tickets: 1, vip: true },
            { name: 'Stephen Markley', role: 'EP', tickets: 1, vip: true },
            { name: 'Vance Lovett', role: 'Crew', tickets: 1, vip: true },
            { name: 'Lauren Pennington', role: '', tickets: 1, vip: false },
            { name: 'Missy Wall', role: '', tickets: 1, vip: false },
            { name: 'Mike Amico', role: 'DP', tickets: 1, vip: true },
            { name: 'Josh Land', role: 'Editor', tickets: 1, vip: true },
            { name: 'Cam Owen', role: '2nd Unit DP', tickets: 1, vip: true },

            { name: 'Danielle Carr', role: 'Music', tickets: 1, vip: true },
            { name: 'Kristi Lugo', role: '', tickets: 2, vip: true },
            { name: 'Tara Roy', role: '', tickets: 1, vip: true },
            { name: 'Kacey Short', role: '', tickets: 1, vip: true },
            { name: 'Scarlett McDonald', role: '', tickets: 1, vip: true },
            { name: 'James Maas', role: '', tickets: 1, vip: false },
            { name: 'Sydni Williams', role: '', tickets: 1, vip: false },
            { name: 'Michael Dougherty', role: '', tickets: 1, vip: false },
            { name: 'Christine Armstrong', role: '', tickets: 1, vip: false },
            { name: 'Adrian Totten', role: '', tickets: 1, vip: false },
            { name: 'Nico Boles', role: '', tickets: 1, vip: false },
            { name: 'Brent Katz', role: '', tickets: 1, vip: false },
            { name: 'Jordan Reed', role: '', tickets: 1, vip: false },
            { name: 'Veronica Wall', role: '', tickets: 1, vip: false },
            { name: 'Natalia Veras', role: '', tickets: 1, vip: false },
            { name: 'Maccabee Montanan', role: '', tickets: 2, vip: false },
            { name: 'Lily Jablonski', role: '', tickets: 2, vip: false },
            { name: 'Catherine Curtin', role: '', tickets: 1, vip: false },
            { name: 'SJ Alocco', role: '', tickets: 1, vip: false },
            { name: 'Bill Williams', role: '', tickets: 1, vip: false },
            { name: 'Chris Murphy', role: '', tickets: 2, vip: true },
            { name: 'Jessica Thompson', role: '', tickets: 1, vip: false },
            { name: 'Will Jacobson', role: '', tickets: 1, vip: false },
            { name: 'Priya Roy', role: '', tickets: 1, vip: false },
            { name: 'Anand Ramprasad', role: '', tickets: 1, vip: false },
            { name: 'Alexis Texas', role: '', tickets: 1, vip: false }
        ];

        function nameKey(name) {
            return name.toLowerCase().replace(/[^a-z0-9]/g, '_');
        }

        function statusHtml(val) {
            if (val === 'Yes') return '<span class="status status-yes">Yes</span>';
            if (val === 'No') return '<span class="status status-no">No</span>';
            return '<span class="status status-pending">&mdash;</span>';
        }

        function buildLink(g) {
            var url = baseUrl + '?name=' + encodeURIComponent(g.name);
            if (g.tickets > 1) url += '&tickets=' + g.tickets;
            if (g.vip) url += '&vip=1';
            return url;
        }

        function renderTables(rsvpData) {
            var vipBody = document.querySelector('#vipTable tbody');
            var regBody = document.querySelector('#regularTable tbody');
            vipBody.innerHTML = '';
            regBody.innerHTML = '';
            var totalTickets = 0, totalGuests = 0, premiereYes = 0;
            var knownKeys = {};

            guests.forEach(function(g) {
                totalTickets += g.tickets;
                totalGuests++;

                var key = nameKey(g.name);
                knownKeys[key] = true;
                var rsvp = rsvpData[key] || null;
                var premiereStatus = rsvp ? rsvp.premiere : null;
                var guestNames = rsvp && rsvp.guests ? rsvp.guests : [];

                if (premiereStatus === 'Yes') premiereYes++;

                var link = buildLink(g);
                var row = document.createElement('tr');

                if (g.vip) {
                    row.innerHTML =
                        '<td><span class="guest-name">' + g.name + '</span></td>' +
                        '<td class="hide-mobile">' + g.role + '</td>' +
                        '<td class="tickets-col">' + g.tickets + '</td>' +
                        '<td>' + statusHtml(premiereStatus) + '</td>' +
                        '<td><a class="invite-link" data-url="' + link + '">Copy</a></td>';
                    vipBody.appendChild(row);

                    guestNames.forEach(function(gn) {
                        var gKey = nameKey(gn);
                        knownKeys[gKey] = true;
                        var gRsvp = rsvpData[gKey] || null;
                        var gRow = document.createElement('tr');
                        gRow.style.opacity = '0.7';
                        var gLink = baseUrl + '?name=' + encodeURIComponent(gn);
                        var gPremiereStatus = gRsvp ? gRsvp.premiere : null;
                        if (gPremiereStatus === 'Yes') premiereYes++;
                        totalGuests++;
                        gRow.innerHTML =
                            '<td style="padding-left:1.5rem;"><span class="guest-name">' + gn + '</span><span class="guest-role"> &mdash; Guest of ' + g.name + '</span></td>' +
                            '<td class="hide-mobile"></td>' +
                            '<td class="tickets-col"></td>' +
                            '<td>' + statusHtml(gPremiereStatus) + '</td>' +
                            '<td><a class="invite-link" data-url="' + gLink + '">Copy</a></td>';
                        vipBody.appendChild(gRow);
                    });
                } else {
                    row.innerHTML =
                        '<td><span class="guest-name">' + g.name + '</span></td>' +
                        '<td class="tickets-col">' + g.tickets + '</td>' +
                        '<td>' + statusHtml(premiereStatus) + '</td>' +
                        '<td><a class="invite-link" data-url="' + link + '">Copy</a></td>';
                    regBody.appendChild(row);

                    guestNames.forEach(function(gn) {
                        var gKey = nameKey(gn);
                        knownKeys[gKey] = true;
                        var gRsvp = rsvpData[gKey] || null;
                        var gRow = document.createElement('tr');
                        gRow.style.opacity = '0.7';
                        var gLink = baseUrl + '?name=' + encodeURIComponent(gn);
                        var gPremiereStatus = gRsvp ? gRsvp.premiere : null;
                        if (gPremiereStatus === 'Yes') premiereYes++;
                        totalGuests++;
                        gRow.innerHTML =
                            '<td style="padding-left:1.5rem;"><span class="guest-name">' + gn + '</span><span class="guest-role"> &mdash; Guest of ' + g.name + '</span></td>' +
                            '<td class="tickets-col"></td>' +
                            '<td>' + statusHtml(gPremiereStatus) + '</td>' +
                            '<td><a class="invite-link" data-url="' + gLink + '">Copy</a></td>';
                        regBody.appendChild(gRow);
                    });
                }
            });

            Object.keys(rsvpData).forEach(function(key) {
                if (knownKeys[key]) return;
                var rsvp = rsvpData[key];
                if (!rsvp || !rsvp.name) return;
                totalGuests++;
                if (rsvp.premiere === 'Yes') premiereYes++;
                var row = document.createElement('tr');
                var gLink = baseUrl + '?name=' + encodeURIComponent(rsvp.name);
                row.innerHTML =
                    '<td><span class="guest-name">' + rsvp.name + '</span></td>' +
                    '<td class="tickets-col">' + (rsvp.tickets || 1) + '</td>' +
                    '<td>' + statusHtml(rsvp.premiere) + '</td>' +
                    '<td><a class="invite-link" data-url="' + gLink + '">Copy</a></td>';
                regBody.appendChild(row);
            });

            document.getElementById('stats').innerHTML =
                '<div class="stat-box"><div class="stat-number">' + totalGuests + '</div><div class="stat-label">Attendees</div></div>' +
                '<div class="stat-box"><div class="stat-number">' + totalTickets + '</div><div class="stat-label">Total Tickets</div></div>' +
                '<div class="stat-box"><div class="stat-number">' + premiereYes + '</div><div class="stat-label">Premiere RSVPs</div></div>';
        }

        var db = null;
        var statusEl = document.getElementById('dbStatus');
        try {
            if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey !== 'FIREBASE_API_KEY') {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                statusEl.textContent = 'Database connected. Waiting for data...';
                db.ref('rsvps').on('value', function(snapshot) {
                    var data = snapshot.val() || {};
                    var count = Object.keys(data).length;
                    statusEl.textContent = 'Live — ' + count + ' RSVP(s) in database';
                    statusEl.style.color = '#4CAF50';
                    renderTables(data);
                }, function(error) {
                    statusEl.textContent = 'Database error: ' + error.message;
                    statusEl.style.color = '#e57373';
                    renderTables({});
                });
            } else {
                var reason = '';
                if (typeof firebase === 'undefined') reason = 'Firebase SDK not loaded';
                else if (typeof firebaseConfig === 'undefined') reason = 'Config file not loaded';
                else reason = 'Config has placeholder values';
                statusEl.textContent = 'Offline — ' + reason;
                statusEl.style.color = '#e57373';
                renderTables({});
            }
        } catch(e) {
            statusEl.textContent = 'Error: ' + e.message;
            statusEl.style.color = '#e57373';
            renderTables({});
        }

        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('invite-link')) {
                e.preventDefault();
                var url = e.target.getAttribute('data-url');
                navigator.clipboard.writeText(url).then(function() {
                    e.target.textContent = 'Copied!';
                    e.target.classList.add('copied');
                    setTimeout(function() {
                        e.target.textContent = 'Copy';
                        e.target.classList.remove('copied');
                    }, 2000);
                });
            }
        });
    </script>
</body>
</html>
