<style>
  :root {
    --sky: #4DB8C4;
    --sky-deep: #3a9daa;
    --orange: #FF8C42;
    --orange-dark: #e67a30;
    --white: #ffffff;
    --cream: #f5f0e8;
    --dark: #1a2a32;
    --dark-mid: #2C3E50;
    --text-soft: rgba(255,255,255,0.85);
    --text-dim: rgba(255,255,255,0.55);
    --hair: rgba(255,255,255,0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--white);
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }

  .wrap {
    max-width: 30rem;          /* phone-first: QR scans from TV land here */
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
  }

  /* ---------- masthead ---------- */

  .laurels {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .laurels img { height: 62px; width: auto; opacity: .92; }

  h1 {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: clamp(3rem, 15vw, 4.75rem);
    line-height: .88;
    letter-spacing: 3px;
    margin-bottom: .6rem;
  }

  .logline {
    color: var(--text-soft);
    font-size: 1.02rem;
    font-weight: 300;
    max-width: 24rem;
    margin: 0 auto 1.1rem;
  }

  .meta {
    font-size: .72rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
    margin-bottom: 2rem;
  }

  /* ---------- trailer / poster ---------- */

  .media {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 2.25rem;
    background: #000;
    box-shadow: 0 18px 44px rgba(0,0,0,.5);
  }
  .media .ratio { position: relative; width: 100%; padding-top: 56.25%; }
  .media iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
  }
  .media img.poster { display: block; width: 100%; height: auto; }

  /* ---------- buy ---------- */

  .buy-label {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 1.5rem;
    letter-spacing: 2px;
    margin-bottom: 1rem;
  }

  .primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .6rem;
    width: 100%;
    padding: 1.15rem 1.5rem;
    background: var(--orange);
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: background .18s ease, transform .18s ease;
  }
  .primary:hover { background: var(--orange-dark); transform: translateY(-2px); }
  .primary:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }

  .primary-note {
    font-size: .74rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: .7rem;
  }

  .others {
    display: grid;
    gap: .55rem;
    margin-top: 1.6rem;
  }

  .other {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: .9rem 1.2rem;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    color: var(--cream);
    text-decoration: none;
    font-size: .95rem;
    font-weight: 500;
    transition: background .25s ease, border-color .25s ease,
                transform .25s ease, box-shadow .25s ease;
  }
  .other:hover {
    background: rgba(255,140,66,.15);
    border-color: var(--orange);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(255,140,66,.2);
  }
  .other:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .other .price { font-size: .78rem; font-weight: 400; color: var(--text-dim); white-space: nowrap; }

  .pending {
    padding: 1.1rem 1.2rem;
    border: 1px dashed var(--hair);
    border-radius: 10px;
    color: var(--text-dim);
    font-size: .87rem;
  }

  /* ---------- cast ---------- */

  .section-rule {
    border: 0;
    border-top: 1px solid var(--hair);
    margin: 3rem 0 1.75rem;
  }

  .kicker {
    font-size: .7rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
    margin-bottom: 1.1rem;
  }

  .cast {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem .75rem;
  }
  .cast figure { margin: 0; }
  .cast img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    display: block;
    background: var(--dark-mid);
  }
  .cast figcaption {
    font-size: .74rem;
    font-weight: 600;
    margin-top: .45rem;
    line-height: 1.3;
  }

  .synopsis {
    color: var(--text-soft);
    font-size: .95rem;
    font-weight: 300;
    text-align: left;
    max-width: 26rem;
    margin: 0 auto;
  }
  .synopsis p + p { margin-top: .85rem; }

  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--hair);
    font-size: .74rem;
    color: var(--text-dim);
    letter-spacing: .06em;
  }
  footer a { color: var(--sky); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* ---------- wider screens: stay centred and calm, don't sprawl ---------- */

  @media (min-width: 48rem) {
    .wrap { max-width: 34rem; padding-top: 3.5rem; }
    .laurels img { height: 74px; }
    .cast { grid-template-columns: repeat(4, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W7RCZNFN"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="wrap">

  <div class="laurels">
    <img src="assets/tf26_laurel_os_W.png" alt="Official Selection, 2026 Tribeca Festival">
  </div>

  <h1>That Friend</h1>

  <p class="logline" id="logline">
    <!-- TODO: replace with the final approved logline. -->
    A reunion between old friends turns into a reckoning none of them saw coming.
  </p>

  <p class="meta" id="meta">
    <!-- TODO: confirm runtime + rating -->
    Feature Film &middot; 2026
  </p>

  <div class="media">
    <div class="ratio" id="trailerSlot">
      <!-- Trailer is injected here by script if TRAILER is set below.
           Falls back to the poster so the page is never empty. -->
    </div>
  </div>

  <p class="buy-label">Watch it now</p>

  <div id="buyPrimary"></div>
  <div class="others" id="buyOthers"></div>

  <hr class="section-rule">

  <p class="kicker">Starring</p>
  <div class="cast">
    <figure><img src="assets/cast/harvey-g.jpeg"  alt="Harvey Guillén"><figcaption>Harvey Guillén</figcaption></figure>
    <figure><img src="assets/cast/josh-b.jpeg"    alt="Josh Brener"><figcaption>Josh Brener</figcaption></figure>
    <figure><img src="assets/cast/billie-l.jpeg"  alt="Billie Lourd"><figcaption>Billie Lourd</figcaption></figure>
    <figure><img src="assets/cast/retta.png"      alt="Retta"><figcaption>Retta</figcaption></figure>
    <figure><img src="assets/cast/neil-bjr.png"   alt="Neil Brown Jr."><figcaption>Neil Brown Jr.</figcaption></figure>
    <figure><img src="assets/cast/miles-gr.png"   alt="Miles Gutierrez-Riley"><figcaption>Miles Gutierrez-Riley</figcaption></figure>
  </div>

  <hr class="section-rule">

  <p class="kicker">About the film</p>
  <div class="synopsis" id="synopsis">
    <!-- TODO: replace with the final approved synopsis. Two short paragraphs
         is the right length — enough that Google reads this as real content
         rather than a thin page that only exists to bounce people out. -->
    <p>An Official Selection of the 2026 Tribeca Festival.</p>
    <p>Full synopsis to come.</p>
  </div>

  <footer>
    &copy; <span id="yr"></span> That Friend
    <!-- Deliberately links nowhere. This is a standalone ad destination,
         like social.html: no nav, not linked from the main site, and no
         path back into pages that sit behind auth.js. -->
  </footer>

</div>

<script>
(function () {
  'use strict';

  // ==================================================================
  // EDIT HERE — the only place purchase links live.
  //
  // Set `url` for each storefront as it goes live. Anything still null
  // renders as "coming soon" instead of a dead button.
  //
  // Exactly ONE entry should have primary: true. That is the single
  // dominant call to action — four equal buttons is choice paralysis
  // and gives us nothing to optimise against.
  // ==================================================================

  var STOREFRONTS = [
    { key: 'appletv',  label: 'Apple TV',          price: '',  url: null, primary: true  },
    { key: 'amazon',   label: 'Prime Video',       price: '',  url: null, primary: false },
    { key: 'fandango', label: 'Fandango at Home',  price: '',  url: null, primary: false },
    { key: 'googletv', label: 'Google TV',         price: '',  url: null, primary: false }
  ];

  // Vimeo ID for the trailer, or null to show the poster instead.
  var TRAILER = null;

  // ------------------------------------------------------------------
  // Carry ad attribution through to the storefront.
  //
  // We cannot see what happens inside Apple or Amazon — no pixel, no
  // postback. Appending our params is the most we can do, and the
  // outbound event below is what we actually measure.
  // ------------------------------------------------------------------

  var PASS_THROUGH = ['utm_source','utm_medium','utm_campaign','utm_term',
                      'utm_content','gclid','gbraid','wbraid','fbclid'];

  function inboundParams() {
    var out = {};
    try {
      var q = new URLSearchParams(window.location.search);
      PASS_THROUGH.forEach(function (k) {
        var v = q.get(k);
        if (v) out[k] = v;
      });
    } catch (e) { /* very old browser — attribution is best-effort */ }
    return out;
  }

  var INBOUND = inboundParams();

  function decorate(url) {
    var keys = Object.keys(INBOUND);
    if (!keys.length) return url;
    try {
      var u = new URL(url);
      keys.forEach(function (k) { u.searchParams.set(k, INBOUND[k]); });
      return u.toString();
    } catch (e) { return url; }
  }

  // ------------------------------------------------------------------
  // The conversion we can actually count: a storefront handoff.
  // Fires before navigation, on Google and Meta.
  // ------------------------------------------------------------------

  function trackHandoff(store) {
    var payload = {
      storefront: store.key,
      storefront_label: store.label,
      is_primary: !!store.primary,
      utm_source: INBOUND.utm_source || '',
      utm_campaign: INBOUND.utm_campaign || '',
      has_gclid: !!INBOUND.gclid
    };
    try { if (window.gtag) gtag('event', 'storefront_handoff', payload); } catch (e) {}
    try { if (window.fbq) fbq('trackCustom', 'StorefrontHandoff', payload); } catch (e) {}
    try {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push(Object.assign({ event: 'storefront_handoff' }, payload));
    } catch (e) {}
  }

  // ------------------------------------------------------------------
  // Render
  // ------------------------------------------------------------------

  function makeLink(store, cls) {
    var a = document.createElement('a');
    a.className = cls;
    a.href = decorate(store.url);
    a.target = '_blank';
    a.rel = 'noopener';
    a.addEventListener('click', function () { trackHandoff(store); });
    return a;
  }

  var primaryHost = document.getElementById('buyPrimary');
  var othersHost  = document.getElementById('buyOthers');

  var live = STOREFRONTS.filter(function (s) { return !!s.url; });

  if (!live.length) {
    primaryHost.innerHTML =
      '<div class="pending">Rent or buy links go live on release day. ' +
      'This page is the destination for every ad, so it stays at this URL.</div>';
  } else {
    var primary = live.filter(function (s) { return s.primary; })[0] || live[0];

    var pa = makeLink(primary, 'primary');
    pa.textContent = 'Watch on ' + primary.label;
    primaryHost.appendChild(pa);

    var note = document.createElement('p');
    note.className = 'primary-note';
    note.textContent = 'Rent or buy' + (primary.price ? ' · from ' + primary.price : '');
    primaryHost.appendChild(note);

    live.forEach(function (s) {
      if (s === primary) return;
      var a = makeLink(s, 'other');
      var name = document.createElement('span');
      name.textContent = s.label;
      a.appendChild(name);
      if (s.price) {
        var p = document.createElement('span');
        p.className = 'price';
        p.textContent = s.price;
        a.appendChild(p);
      }
      othersHost.appendChild(a);
    });
  }

  // Trailer, or poster as the fallback so the slot is never blank.
  var slot = document.getElementById('trailerSlot');
  if (TRAILER) {
    var f = document.createElement('iframe');
    f.src = 'https://player.vimeo.com/video/' + TRAILER + '?title=0&byline=0&portrait=0';
    f.title = 'That Friend — official trailer';
    f.allow = 'autoplay; fullscreen; picture-in-picture';
    f.setAttribute('allowfullscreen', '');
    slot.appendChild(f);
  } else {
    slot.style.paddingTop = '0';
    var img = document.createElement('img');
    img.className = 'poster';
    img.src = 'assets/poster.jpg';
    img.alt = 'That Friend — poster';
    slot.appendChild(img);
  }

  document.getElementById('yr').textContent = new Date().getFullYear();
})();
</script>
