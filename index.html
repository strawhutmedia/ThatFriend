<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>That Friend Movie</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">THAT FRIEND</a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="press.html">Press</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Hero with video loop background -->
    <section class="hero">
        <!-- Vimeo background video -->
        <iframe class="hero-video" src="https://player.vimeo.com/video/1177426220?h=8c4f3d57a5&background=1&autoplay=1&loop=1&muted=1&title=0&byline=0&portrait=0" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <div class="hero-video-fallback"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="laurels">
                <img src="assets/tf26_laurel_os_W.png" alt="Official Selection - 2026 Tribeca Festival" class="laurel-img">
            </div>
        </div>
    </section>

    <!-- Spacer between video and poster -->
    <div class="hero-poster-spacer"></div>

    <!-- Poster -->
    <section class="poster-section">
        <div class="poster-frame reveal">
            <img src="assets/poster.jpg" alt="That Friend - Official Poster">
        </div>
    </section>

    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-col">
                <h4>That Friend</h4>
                <p>A Bolo Production<br>in association with Straw Hut Media</p>
            </div>
            <div class="footer-col">
                <h4>Navigation</h4>
                <a href="index.html">Home</a><br>
                <a href="about.html">About</a><br>
                <a href="press.html">Press</a><br>
                <a href="epk.html">EPK</a>
            </div>
            <div class="footer-col footer-col-form">
                <h4>Get in Touch</h4>
                <form action="https://formspree.io/f/xnjondvq" method="POST" class="contact-form">
                    <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
                    <div class="form-row">
                        <input type="text" name="name" placeholder="Name" required>
                        <input type="email" name="email" placeholder="Email" required>
                    </div>
                    <select name="subject">
                        <option value="" disabled selected>Subject</option>
                        <option value="Press Inquiry">Press Inquiry</option>
                        <option value="Distribution">Distribution</option>
                        <option value="Screening Request">Screening Request</option>
                        <option value="General">General</option>
                    </select>
                    <textarea name="message" placeholder="Message" rows="3" required></textarea>
                    <button type="submit" class="btn-contact">Send Message</button>
                </form>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025&ndash;2026 That Friend. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.getElementById('hamburger').addEventListener('click', function() {
            document.getElementById('navLinks').classList.toggle('active');
        });

        // Scroll reveal
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal, .reveal-left, .reveal-right').forEach(el => observer.observe(el));
    </script>
</body>
</html>
